<body>
<a class="skip" href="#main">Skip to content</a>
<header data-hs-header></header>

<main id="main">
  <section>
    <div class="wrap">
      <h1 id="title">Directory</h1>
      <p class="muted" style="max-width:60ch">Every group, club, regular activity and place we know about. Filter it down, or flip to the map.</p>

      <form class="filters" id="filters">
        <div><label class="sr-only" for="q">Search</label><input id="q" type="search" placeholder="Search names, tags, descriptions…"></div>
        <div><label class="sr-only" for="town">Town</label><select id="town"><option value="">All towns</option></select></div>
        <div><label class="sr-only" for="aud">Who for</label><select id="aud"><option value="">Anyone</option></select></div>
        <div><label class="sr-only" for="cost">Cost</label><select id="cost"><option value="">Any cost</option><option value="free">Free</option><option value="paid">Paid</option><option value="membership">Membership</option></select></div>
      </form>
      <div class="chips" id="cats"></div>
      <div class="chips" id="types"></div>

      <div class="toolbar">
        <div class="count" id="count"></div>
        <div class="row">
          <select id="sort" style="width:auto"><option value="name">Sort: A–Z</option><option value="town">Sort: Town</option><option value="category">Sort: Category</option></select>
          <div class="seg" role="tablist"><button id="v-list" class="on" type="button">List</button><button id="v-map" type="button">Map</button></div>
          <button class="btn ghost sm" id="clear" type="button">Clear filters</button>
        </div>
      </div>

      <div id="results" class="grid"></div>
      <div id="map" class="map" hidden></div>
    </div>
  </section>
</main>
