<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex,nofollow">
<title>Moderation — Helderberg Social</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header data-hs-header></header>

<main id="main">
  <section>
    <div class="wrap-narrow">
      <h1>Moderation</h1>
      <p class="muted">For the site's moderator. There is no password: enter the moderator address and a sign-in link is emailed to it. The link works for twelve hours.</p>
      <form id="f" class="panel" novalidate>
        <div class="field"><label for="email">Moderator email</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email"><div class="err"></div></div>
        <div class="row"><button class="btn" type="submit" id="send">Email me a sign-in link</button></div>
      </form>
      <div id="done" class="notice ok" hidden style="margin-top:1rem"></div>
    </div>
  </section>
</main>

<footer data-hs-footer></footer>

<script src="data/data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/pages/moderate.js"></script>
</body>
</html>
